# helpfledgling.ai — build docs/ with Sphinx and deploy to GitHub Pages.
# Copied from judgementalmonad.com's pages.yml. Two additions:
#   - a leak check between build and upload: docs/ also holds internal files
#     (briefs, specs, RFCs), and a leak must block the deploy;
#   - pull requests build and leak-check too, but never deploy.

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "requirements-docs.txt"
      - "scripts/check_site_leaks.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "requirements-docs.txt"
      - "scripts/check_site_leaks.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      - name: Build Sphinx site
        run: sphinx-build -b html docs docs/_build/html

      - name: Refuse to publish internal material
        run: python3 scripts/check_site_leaks.py docs/_build/html

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
