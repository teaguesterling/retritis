name: fresh-install

# Catch the recurring packaging failures (bad pins, wrong-name extras, missing
# extras, unpublished local deps, duckdb-extension gaps) by doing a CLEAN
# install of each suite tool from PyPI and booting its MCP server. Runs weekly,
# on demand, and whenever the meta-package pins change.
on:
  schedule:
    - cron: "0 6 * * 1"        # Mondays 06:00 UTC
  workflow_dispatch: {}
  push:
    paths: ["pyproject.toml", ".github/workflows/fresh-install.yml"]

jobs:
  per-tool:
    name: ${{ matrix.tool.pkg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool:
          - { pkg: "squackit",      boot: "squackit mcp serve" }
          - { pkg: "fledgling-mcp", boot: "fledgling-mcp serve" }
          - { pkg: "jetsam-mcp",    boot: "jetsam serve" }
          - { pkg: "blq-cli[mcp]",  boot: "blq mcp serve" }
          - { pkg: "lackpy[mcp]",   boot: "lackpyctl mcp serve" }
          - { pkg: "kibitzer",      boot: "kibitzer mcp serve" }
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Clean install (ONLY this tool, from PyPI)
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install --upgrade pip
          /tmp/v/bin/pip install "${{ matrix.tool.pkg }}"

      - name: Install duckdb community extensions (backends need them at boot)
        run: |
          /tmp/v/bin/python - <<'PY' || true
          import duckdb
          con = duckdb.connect()
          for ext in ("sitting_duck", "duck_tails", "duck_hunt"):
              try:
                  con.execute(f"INSTALL {ext} FROM community")
              except Exception as e:
                  print(f"skip {ext}: {e}")
          PY

      # fledgling-mcp's `serve` is not a Python server. cli.py:153 ends in
      # os.execvp("duckdb", cmd), so the process BECOMES the duckdb CLI, and the
      # MCP server is the mcp_server_start() call at the end of
      # init-fledgling-analyst.sql, inside that CLI. The guard at cli.py:121 that
      # printed "Error: duckdb CLI not found in PATH" has nothing between it and
      # that exec which uses duckdb or avoids it -- the lines in between only
      # locate the init SQL and build the argv. So there is no later operation to
      # defer the check to: the binary is a hard requirement to serve at all, and
      # this job has to supply it.
      #
      # PINNED to an exact tag, not releases/latest, for the reason duckeye's
      # test.yml gives: 2.0.0 RENAMED every release asset, from
      # duckdb_cli-linux-amd64.zip to duckdb-cli-linux-amd64.tar.gz, so a stale
      # URL 404s and curl exits 22. `latest` also means the tested version can
      # change with no commit. The tag here is 1.5.6, NOT duckeye's v2.0.0, so the
      # asset is still the .zip: fledgling pins duckdb>=1.5.2,<1.6 in its
      # pyproject and says the same in its README, so 2.0.0 is outside the range
      # the package claims to support. Both 1.5.6 and 2.0.0 were measured booting
      # green; 1.5.6 is the supported one, and it is also what pip resolves for
      # the Python module today, so this step and the one above share one
      # ~/.duckdb/extensions/v1.5.6 store instead of two version-keyed ones.
      - name: Install DuckDB CLI (fledgling-mcp execs it to serve)
        if: matrix.tool.pkg == 'fledgling-mcp'
        run: |
          curl -fsSL "https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip" \
            -o /tmp/duckdb-cli.zip
          unzip -o /tmp/duckdb-cli.zip -d /tmp/duckdb-cli
          sudo install /tmp/duckdb-cli/duckdb /usr/local/bin/
          duckdb --version

      # The CLI reads its own extension store, and the step above covers only two
      # of the six extensions that fledgling's init-fledgling-base.sql LOADs. With
      # the CLI installed but this step absent, the boot still exits 1 -- first on
      # duckdb_mcp, then on fts (both measured in a clean HOME). This list mirrors
      # the LOAD lines in init-fledgling-base.sql; fts is a CORE extension, so it
      # installs without FROM community.
      #
      # Deliberately NOT wrapped in `|| true`. The step above is, which is why its
      # coverage gap stayed invisible until the boot step failed in its place.
      #
      # THIS STEP IS A STOPGAP, unlike the CLI step above it. Installing the CLI is
      # this repo's job; installing fledgling's extensions is fledgling's.
      # init-fledgling-base.sql:15-20 LOADs all six and INSTALLs none, and an
      # explicit LOAD does not autoinstall, so `serve` fails on a cold
      # ~/.duckdb/extensions even though fledgling's getting-started.md:8 says they
      # are "installed automatically on first use". The real fix is an INSTALL
      # before each LOAD in fledgling's init SQL: the sandbox lockdown runs after
      # that file is .read, so it would not be refused. Until then this step makes
      # CI green for a case a real `pip install fledgling-mcp` still fails, and the
      # list here is a COPY of fledgling's LOAD lines, so a seventh LOAD will break
      # this job again. Delete this step once fledgling INSTALLs what it LOADs.
      - name: Install the duckdb extensions fledgling LOADs at boot
        if: matrix.tool.pkg == 'fledgling-mcp'
        run: |
          set -euo pipefail
          for ext in duckdb_mcp read_lines sitting_duck markdown duck_tails; do
            duckdb -c "INSTALL $ext FROM community"
          done
          duckdb -c "INSTALL fts"

      - name: Boot the MCP server
        # Success = exits 0 on </dev/null, or 124 (timed out = stayed up).
        # An import/resolution crash exits non-zero quickly.
        run: |
          set +e
          timeout 15 /tmp/v/bin/${{ matrix.tool.boot }} </dev/null
          rc=$?
          echo "boot exit: $rc"
          [ $rc -eq 0 ] || [ $rc -eq 124 ]

  meta:
    name: retritis[all] installs together
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install the pinned suite as one set
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install --upgrade pip
          /tmp/v/bin/pip install ".[all]"
